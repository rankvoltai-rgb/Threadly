# Render Blueprint — https://render.com/docs/blueprint-spec
# Create from the dashboard: New > Blueprint, point it at this repo.
services:
  - type: web
    name: threadly
    runtime: node
    plan: free # free spins down after ~15 min idle; switch to "starter" to keep it warm
    region: oregon
    branch: main
    # Convex ships its functions first, then injects the prod deployment URL
    # into the Next.js build so the client bundle points at the right backend.
    buildCommand: >-
      npm ci &&
      npx convex deploy
      --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL
      --cmd 'npm run build'
    startCommand: npm start
    healthCheckPath: /api/license
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Secrets — Render prompts for these when the Blueprint is created.
      - key: APIFY_TOKEN
        sync: false
      # NOTE: currently set to the *dev* deploy key (robust-sardine-18) by
      # choice. The live site therefore shares a backend with local
      # `npx convex dev` — running that locally overwrites production functions.
      # Swap for a Production deploy key when convenient.
      - key: CONVEX_DEPLOY_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: APIFY_THREADS_ACTOR
        value: automation-lab~threads-scraper
      # Signs the licence cookie. Render generates it once and keeps it stable.
      - key: LICENSE_SECRET
        generateValue: true
